[report]
# -----------------------------------------------------------------
# FORM TYPES — comma separated prefixes, case-insensitive.
#   * Matched as PREFIXES: "8-K" catches 8-K, 8-K/A, 8-K12B, …
#   * Use the keyword ALL to disable filtering entirely.
#   * Values with spaces (like "DEF 14") work fine here.
# -----------------------------------------------------------------
form_types = 8-K, 10-K, 10-Q, DEF 14, DEFC14, DEFM14, DEFR14, DEFN14, 20-F, 40-F

# -----------------------------------------------------------------
# DATE PERIOD (inclusive). YYYY-MM-DD.
#   * start_date == end_date  → one day only.
#   * Optional single-day shortcut: uncomment `date =`.
#   * If all blank, falls back to `days_back` (relative to today).
# -----------------------------------------------------------------
start_date = 2026-09-14
end_date   = 2026-09-18
# date     = 2026-03-23
days_back  = 1

# -----------------------------------------------------------------
# EMAIL RECIPIENTS
# -----------------------------------------------------------------
recipients = auditfeeteam@gmail.com, santhakumarcu@gmail.com, maharaja@secanalyzer.net, chandru@secanalyzer.net
